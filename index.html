<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="robots" content="noindex">

		<title>Global Cities Comparison</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">
		<link rel="icon" href="./img/favicon.ico">
		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">

		<style>
			section .center-vertically {
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">

				<!-- タイトル -->
				<section data-background-image="./img/title.jpg">
					<p style="font-size: 30px;">Global Cities' Competitiveness</p>
					<h2>世界の都市競争力</h2>
					<p style="font-size: 30px;">#4 世界都市の比較分析</p>
				</section>

				<!-- ====================== 基礎情報 ====================== -->
				<section>
					<!-- 行政区域 -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/boundary/boundary.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
					<!-- 世界人口 -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/population/population_world/world_population.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
					<!-- 人口密度（日本） -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/population/population_density/japan/population_density_jp.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
					<!-- 人口密度（グローバル都市） -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/population/population_density/global_cities/population_density_global_cities.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
				</section>
				
				<!-- ====================== 経済分野 ====================== -->
				<section>
					<!-- GDP -->
					<section data-background-color="rgb(255, 255, 255)">
						<iframe class="stretch center-vertically" data-src="./chartjs/gdp/gdp.html" data-preload frameborder="0"
						allowfullscreen></iframe>
						<p style="font-size: small;">出典: OECD、World Bank他</p>
					</section>
					<!-- 人口 -->
					<section data-background-color="rgb(255, 255, 255)">
						<iframe class="stretch center-vertically" data-src="./chartjs/population/population.html" data-preload frameborder="0"
						allowfullscreen></iframe>
						<p style="font-size: small;">出典: 各国統計データ</p>
					</section>
					<!-- 1人あたりGDP -->
					<section data-background-color="rgb(255, 255, 255)">
						<iframe class="stretch center-vertically" data-src="./chartjs/gdp_per_capita/gdp_per_capita.html" data-preload frameborder="0"
						allowfullscreen></iframe>
						<p style="font-size: small;"></p>
					</section>
				</section>
				
				<!-- ====================== 研究・開発分野 ====================== -->
				<section>
					<!-- トップ大学（留学生数） -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/intl_students/intl_students.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
				</section>
				
				<!-- ====================== 文化・交流分野 ====================== -->
				<section>
					<!-- ハイクラスホテル数 -->
					<section data-fullscreen="true" data-background-color="rgb(0, 0, 0)" data-transition="fade-out" data-transition-speed="slow">
						<iframe class="r-stretch" data-src="./mapbox/high_class_hotels/high_class_hotels.html" data-preload frameborder="0" allow="fullscreen"></iframe>
					</section>
				</section>
					
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/zoom/zoom.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<!-- Fullscreen plugin: バージョンを固定 -->
		<script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@4.2.1/fullscreen/plugin.js"></script>
		<!-- Latex -->
		<script src="plugin/math/math.js"></script>

		<script>
			Reveal.initialize({
				hash: true,
				autoPlayMedia: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealFullscreen, RevealMath.KaTeX, RevealZoom ]
			});
		</script>
	</body>
</html>
