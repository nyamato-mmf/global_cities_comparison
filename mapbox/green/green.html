<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cities Comparison</title>
    <!-- mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup-content .popup-content {
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== sidebar ===== */
        #sidebar {
            position: absolute;
            z-index: 2;
            top: 0px;
            left: 0px;
            width: auto;
            padding: 20px;
        }

        .indicator-title {
            color: white;
            font-size: 50px;
        }

        .popupgreen_spots .mapboxgl-popup-content {
            width: 400px;
            font: 14px Arial, sans-serif;
            }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h1 class="indicator-title">緑地 (半径10km)</h1>
    </div>

    <div id="map"></div>

    <script>
        // 環境に応じてトークンを切り替える
        const isDev = window.location.hostname === 'localhost' 
                || window.location.hostname === '127.0.0.1';

        const MAPBOX_TOKEN = isDev
        ? 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJja2Y4dzNkOW8wY3MwMnFvM29iNnJzNzVzIn0.GHlHwu3r5YjKBU3qAKvccQ'    // 開発用
        : 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJjbWxvdWE5cnUwOHQyM2Rxems3ZHFjNHRtIn0.FE09FM6lxL7dZSJtsLAFEg';   // 本番用 (GitHub Pages)

        mapboxgl.accessToken = MAPBOX_TOKEN;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'globe',
            zoom: 3,       // 修正: 5 → 1.5（地球全体が見えるズームレベル）
            pitch: 0,        // 修正: 30 → 0（真正面から見る）
            bearing: 0,      // 修正: -10 → 0
            center: [138.2906, 37.5873],
        });

        map.on('style.load', () => {
            map.setFog({
                color: 'rgb(186, 210, 235)',
                'high-color': 'rgb(36, 92, 223)',
                'horizon-blend': 0.02,
                'space-color': 'rgb(11, 11, 25)',
                'star-intensity': 0.6
            });
        });

        // ===== 緑地ラスター（半径10km）Mapboxでtilesetを作成 =====
        map.on('load', () => {

            const rasterLayers = [
                { id: 'sin_green_coverage', url: 'mapbox://nyamato.79g3hdt3' },
                { id: 'par_green_coverage', url: 'mapbox://nyamato.ckd67ll0' },
                { id: 'lon_green_coverage', url: 'mapbox://nyamato.6tx2kscg' },
                { id: 'nyc_green_coverage', url: 'mapbox://nyamato.5r6lao13' },
                { id: 'tyo_green_coverage', url: 'mapbox://nyamato.9x470mib' },
            ];

            rasterLayers.forEach(({ id, url }) => {
                map.addSource(id, {
                    type: 'raster',
                    url: url
                });
                map.addLayer({
                    id: id,
                    type: 'raster',
                    source: id,
                    layout: { visibility: 'visible' }
                });
            });

            /* --------------------------------------------------------
            　緑地写真スポットのポイントデータを追加
            -------------------------------------------------------- */
            map.loadImage(
                '../../img/marker-green.png',
                (error, image) => {
                    if (error) throw error;

                    // Add the image to the map style.
                    map.addImage('greenicon', image);

                    // Add a data source containing several points' features.
                    map.addSource('green_spots', {
                        'type': 'geojson',
                        'data': {
                            'type': 'FeatureCollection',
                            'features': [
                                {'type': 'Feature', 'properties': {'name': 'High Line New York', 'description': '<strong>High Line New York</strong><p><img src="../../img/green_spots/High Line New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-74.0047649, 40.7479925]}},
                                {'type': 'Feature', 'properties': {'name': 'La Villette Paris', 'description': '<strong>La Villette Paris</strong><p><img src="../../img/green_spots/La Villette Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.3767267, 48.8906167]}},
                                {'type': 'Feature', 'properties': {'name': 'Hyde Park London', 'description': '<strong>Hyde Park London</strong><p><img src="../../img/green_spots/Hyde Park London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1641135, 51.5073638]}},
                                {'type': 'Feature', 'properties': {'name': 'Central Catchment Nature Reserve Singapore', 'description': '<strong>Central Catchment Nature Reserve Singapore</strong><p><img src="../../img/green_spots/Central Catchment Nature Reserve Singapore.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [103.7972022, 1.3551526]}},
                                {'type': 'Feature', 'properties': {'name': 'Montmartre Paris', 'description': '<strong>Montmartre Paris</strong><p><img src="../../img/green_spots/Montmartre Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.3388895, 48.8867148]}},
                                {'type': 'Feature', 'properties': {'name': 'Russell Square London', 'description': '<strong>Russell Square London</strong><p><img src="../../img/green_spots/Russell Square London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.12589, 51.52175]}},
                                {'type': 'Feature', 'properties': {'name': 'Primrose Hill London', 'description': '<strong>Primrose Hill London</strong><p><img src="../../img/green_spots/Primrose Hill London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1533169, 51.5412572]}},
                                {'type': 'Feature', 'properties': {'name': 'Sentosa Island Singapore', 'description': '<strong>Sentosa Island Singapore</strong><p><img src="../../img/green_spots/Sentosa Island Singapore.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [103.8303209, 1.2494041]}},
                                {'type': 'Feature', 'properties': {'name': 'Roosevelt Island  New York', 'description': '<strong>Roosevelt Island  New York</strong><p><img src="../../img/green_spots/Roosevelt Island  New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9499426, 40.7621302]}},
                                {'type': 'Feature', 'properties': {'name': 'Governors Island New York', 'description': '<strong>Governors Island New York</strong><p><img src="../../img/green_spots/Governors Island New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-74.016792, 40.68945009999999]}},
                                {'type': 'Feature', 'properties': {'name': 'Green Park London', 'description': '<strong>Green Park London</strong><p><img src="../../img/green_spots/Green Park London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1434016, 51.5039416]}},
                                {'type': 'Feature', 'properties': {'name': 'Central Park New York', 'description': '<strong>Central Park New York</strong><p><img src="../../img/green_spots/Central Park New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9655834, 40.7825547]}},
                                {'type': 'Feature', 'properties': {'name': 'Tuileries Garden Paris', 'description': '<strong>Tuileries Garden Paris</strong><p><img src="../../img/green_spots/Tuileries Garden Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.3274943, 48.8634916]}},
                                {'type': 'Feature', 'properties': {'name': 'Bois de Vincennes Paris', 'description': '<strong>Bois de Vincennes Paris</strong><p><img src="../../img/green_spots/Bois de Vincennes Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.4502484, 48.8302188]}},
                                {'type': 'Feature', 'properties': {'name': 'The Battery New York', 'description': '<strong>The Battery New York</strong><p><img src="../../img/green_spots/The Battery New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-74.0153603, 40.70293119999999]}},
                                {'type': 'Feature', 'properties': {'name': "Regent's Park London", 'description': '<strong>Regent\'s Park London</strong><p><img src="../../img/green_spots/Regent\'s Park London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1557646, 51.533313]}},
                                {'type': 'Feature', 'properties': {'name': 'Brooklyn Bridge Park New York', 'description': '<strong>Brooklyn Bridge Park New York</strong><p><img src="../../img/green_spots/Brooklyn Bridge Park New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9958601, 40.7022422]}},
                                {'type': 'Feature', 'properties': {'name': 'Hampstead Heath London', 'description': '<strong>Hampstead Heath London</strong><p><img src="../../img/green_spots/Hampstead Heath London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1629416, 51.5608294]}},
                                {'type': 'Feature', 'properties': {'name': 'Queen Elizabeth Olympic Park London', 'description': '<strong>Queen Elizabeth Olympic Park London</strong><p><img src="../../img/green_spots/Queen Elizabeth Olympic Park London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.0152116, 51.5439614]}},
                                {'type': 'Feature', 'properties': {'name': 'Bryant Park New York', 'description': '<strong>Bryant Park New York</strong><p><img src="../../img/green_spots/Bryant Park New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9829529, 40.7535367]}},
                                {'type': 'Feature', 'properties': {'name': 'Gardens by the Bay Singapore', 'description': '<strong>Gardens by the Bay Singapore</strong><p><img src="../../img/green_spots/Gardens by the Bay Singapore.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [103.8636132, 1.2815683]}},
                                {'type': 'Feature', 'properties': {'name': 'Fountain of the Woods Boulogne Paris', 'description': '<strong>Fountain of the Woods Boulogne Paris</strong><p><img src="../../img/green_spots/Fountain of the Woods Boulogne Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.2399123, 48.8396952]}},
                                {'type': 'Feature', 'properties': {'name': 'Champ de Mars Paris', 'description': '<strong>Champ de Mars Paris</strong><p><img src="../../img/green_spots/Champ de Mars Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.2983766, 48.85580470000001]}},
                                {'type': 'Feature', 'properties': {'name': 'Leicester Square London', 'description': '<strong>Leicester Square London</strong><p><img src="../../img/green_spots/Leicester Square London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1300625, 51.510359]}},
                                {'type': 'Feature', 'properties': {'name': 'Empire Fulton Ferry New York', 'description': '<strong>Empire Fulton Ferry New York</strong><p><img src="../../img/green_spots/Empire Fulton Ferry New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9932122, 40.7042545]}},
                            ]
                        }
                    });

                    // Add a layer to use the image to represent the data.
                    map.addLayer({
                        'id': 'green_spots',
                        'type': 'symbol',
                        'source': 'green_spots', // reference the data source
                        'layout': {
                            'icon-image': 'greenicon', // reference the image
                            'icon-size': 1,
                            'visibility': 'visible'
                        },
                    });
                    // On click, get coordinates and a description.
                    map.on('click', 'green_spots', (e) => {
                        const coordinates = e.features[0].geometry.coordinates.slice();
                        const description = e.features[0].properties.description;

                        while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                        }
                        // Create a popup object
                        new mapboxgl.Popup({className: 'popupgreen_spots'})
                            .setLngLat(coordinates)
                            .setHTML(description)
                            .addTo(map);
                    });
                    map.on('mouseenter', 'green_spots', () => {
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    map.on('mouseleave', 'green_spots', () => {
                        map.getCanvas().style.cursor = '';
                    });
                }
            );

        });
        
        // ===== 都市定義 =====
        const cities = {
            GLOBE: { center: [138.2906, 37.5873], label: 'Globe', zoom: 3, pitch: 0, bearing: 0 },
            TYO: { center: [139.7528, 35.6854], label: 'Tokyo', zoom: 11, pitch: 0, bearing: 0 },
            LON: { center: [-0.1281, 51.5081], label: 'London', zoom: 11, pitch: 0, bearing: 0 },
            NYC: { center: [-73.9855, 40.7582], label: 'New York', zoom: 11, pitch: 0, bearing: 0 },
            PAR: { center: [2.34732386, 48.854872],  label: 'Paris', zoom: 11, pitch: 0, bearing: 0 },
            SIN: { center: [103.8513, 1.2830], label: 'Singapore', zoom: 11, pitch: 0, bearing: 0 },
        };

        // ===== 都市名ボタン生成 =====
        const cityContainer = document.createElement('div');
        cityContainer.style.cssText = `
            position: absolute;
            z-index: 2;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        `;

        Object.entries(cities).forEach(([code, city]) => {
            const btn = document.createElement('button');
            btn.textContent = code;
            btn.style.cssText = `
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                border: 1px solid white;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
            `;
            btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
            btn.addEventListener('mouseout',  () => btn.style.background = 'rgba(0,0,0,0.6)');
            btn.addEventListener('click', () => {
                map.flyTo({
                    center: city.center,
                    zoom: city.zoom,
                    pitch: city.pitch,
                    bearing: city.bearing,
                    duration: 3000,
                    essential: true,
                });
            });
            cityContainer.appendChild(btn);
        });

        document.getElementById('map').appendChild(cityContainer);

    </script>

</body>

</html>
