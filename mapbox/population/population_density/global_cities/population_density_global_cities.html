<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cities Comparison</title>
    <!-- mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup-content .popup-content {
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== sidebar ===== */
        #sidebar {
            position: absolute;
            z-index: 2;
            top: 0px;
            left: 0px;
            width: auto;
            padding: 20px;
        }

        .indicator-title {
            color: white;
            font-size: 50px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h1 class="indicator-title">人口密度（グローバル都市）</h1>
    </div>

    <div id="map"></div>

    <script>
        // 環境に応じてトークンを切り替える
        const isDev = window.location.hostname === 'localhost' 
                || window.location.hostname === '127.0.0.1';

        const MAPBOX_TOKEN = isDev
        ? 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJja2Y4dzNkOW8wY3MwMnFvM29iNnJzNzVzIn0.GHlHwu3r5YjKBU3qAKvccQ'    // 開発用
        : 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJjbWxvdWE5cnUwOHQyM2Rxems3ZHFjNHRtIn0.FE09FM6lxL7dZSJtsLAFEg';   // 本番用 (GitHub Pages)

        mapboxgl.accessToken = MAPBOX_TOKEN;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'mercator',
            zoom: 3,
            pitch: 0,
            bearing: 0,
            center: [138.2906, 37.5873],
        });

        map.on('style.load', () => {
            map.setFog({
                color: 'rgb(186, 210, 235)',
                'high-color': 'rgb(36, 92, 223)',
                'horizon-blend': 0.02,
                'space-color': 'rgb(11, 11, 25)',
                'star-intensity': 0.6
            });
        });

        map.on('load', () => {

            // ##### グローバル都市 ##### //
            const globalCities = ['tyo', 'lon', 'nyc', 'par', 'sin'];

            globalCities.forEach(globalCity => {
                const sourceId = `50km_${globalCity}`;
                const layerId  = `density_${globalCity}`;
                map.addSource(sourceId, {
                    'type': 'geojson',
                    'data': `./geojson/${sourceId}.geojson`
                });

                map.addLayer({
                    'id': layerId,
                    'type': 'fill-extrusion',
                    'source': sourceId,
                    'paint': {
                        'fill-extrusion-color': [
                            'interpolate', ['linear'], ['get', 'Density'],
                            0,     '#3288bd',
                            100,   '#66c2a5',
                            250,   '#abdda4',
                            500,   '#e6f598',
                            1000,  '#fee08b',
                            5000,  '#fdae61',
                            10000, '#f46d43',
                            15000, '#d53e4f',
                            20000, '#9e0142'
                        ],
                        'fill-extrusion-height':  ['*', ['get', 'Density'], 5],
                        'fill-extrusion-base':    0,
                        'fill-extrusion-opacity': 0.85,
                    }
                });

                // ===== ポップアップ表示 =====
                map.on('click', layerId, (e) => {
                    const feature   = e.features[0];
                    const popupName  = feature.properties.name1   || 'N/A';
                    const popupValue = feature.properties['Density'] || '';
                    const popupUnit  = '人/km²';

                    new mapboxgl.Popup({ closeButton: true })
                        .setLngLat(e.lngLat)
                        .setHTML(`
                            <div style="max-width:260px;">
                                <div style="font-weight:bold;">
                                    ${popupName}: ${popupValue} ${popupUnit}
                                </div>
                            </div>
                        `)
                        .addTo(map);
                });

                map.on('mouseenter', layerId, () => {
                    map.getCanvas().style.cursor = 'pointer';
                });

                map.on('mouseleave', layerId, () => {
                    map.getCanvas().style.cursor = '';
                });
            });

        });

        // ===== 都市定義 =====
        const cities = {
            GLOBE: { center: [138.2906, 37.5873], label: 'Globe', zoom: 3, pitch: 0, bearing: 0 },
            TYO: { center: [139.7528, 35.6854], label: 'Tokyo', zoom: 7, pitch: 30, bearing: 0 },
            LON: { center: [-0.1281, 51.5081], label: 'London', zoom: 7, pitch: 30, bearing: 0 },
            NYC: { center: [-73.9855, 40.7582], label: 'New York', zoom: 7, pitch: 30, bearing: 0 },
            PAR: { center: [2.3553, 48.8810],  label: 'Paris', zoom: 7, pitch: 30, bearing: 0 },
            SIN: { center: [103.8513, 1.2830], label: 'Singapore', zoom: 7, pitch: 30, bearing: 0 },
        };

        // ===== 都市名ボタン生成 =====
        const cityContainer = document.createElement('div');
        cityContainer.style.cssText = `
            position: absolute;
            z-index: 2;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        `;

        Object.entries(cities).forEach(([code, city]) => {
            const btn = document.createElement('button');
            btn.textContent = code;
            btn.style.cssText = `
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                border: 1px solid white;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
            `;
            btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
            btn.addEventListener('mouseout',  () => btn.style.background = 'rgba(0,0,0,0.6)');
            btn.addEventListener('click', () => {
                map.flyTo({
                    center: city.center,
                    zoom: city.zoom,
                    pitch: city.pitch,
                    bearing: city.bearing,
                    duration: 3000,
                    essential: true,
                });
            });
            cityContainer.appendChild(btn);
        });

        document.getElementById('map').appendChild(cityContainer);

        // ===== 地図投影法定義 =====
        const projections = {
            'globe':    'globe',
            'mercator': 'mercator',
        };
        
        // ===== 地図投影法ボタン =====
        const projectionContainer = document.createElement('div');
        projectionContainer.style.cssText = `
            position: absolute;
            z-index: 2;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        `;

        Object.entries(projections).forEach(([label, projection]) => {
            const btn = document.createElement('button');
            btn.textContent = label;
            btn.style.cssText = `
                padding: 4px 8px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                border: 1px solid white;
                border-radius: 4px;
                cursor: pointer;
                font-size: 12px;
                font-weight: bold;
            `;
            btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
            btn.addEventListener('mouseout',  () => btn.style.background = 'rgba(0,0,0,0.6)');
            btn.addEventListener('click', () => {
                map.setProjection(projection);
            });
            projectionContainer.appendChild(btn);
        });

        document.getElementById('map').appendChild(projectionContainer);
    </script>

</body>

</html>
