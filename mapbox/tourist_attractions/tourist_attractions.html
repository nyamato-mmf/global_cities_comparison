<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/favicon.ico">
    <title>Global Cities Comparison</title>
    <!-- mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup-content .popup-content {
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== sidebar ===== */
        #sidebar {
            position: absolute;
            z-index: 2;
            top: 0px;
            left: 0px;
            width: auto;
            padding: 20px;
        }

        .indicator-title {
            color: white;
            font-size: 50px;
        }

        .popupattraction_spots .mapboxgl-popup-content {
            width: 400px;
            font: 14px Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h2 class="indicator-title">観光スポット</h2>
        <p style="color: white; font-size: 16pt;">(レビュー数: 1000以上)</p>
        <p style="font-size: small; color: white;">出典: TripAdvisor</p>
    </div>

    <div id="map"></div>

    <script>
        // 環境に応じてトークンを切り替える
        const isDev = window.location.hostname === 'localhost' 
                || window.location.hostname === '127.0.0.1';

        const MAPBOX_TOKEN = isDev
        ? 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJja2Y4dzNkOW8wY3MwMnFvM29iNnJzNzVzIn0.GHlHwu3r5YjKBU3qAKvccQ'    // 開発用
        : 'pk.eyJ1IjoibnlhbWF0byIsImEiOiJjbWxvdWE5cnUwOHQyM2Rxems3ZHFjNHRtIn0.FE09FM6lxL7dZSJtsLAFEg';   // 本番用 (GitHub Pages)

        mapboxgl.accessToken = MAPBOX_TOKEN;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'globe',
            zoom: 3,
            pitch: 0,
            bearing: 0,
            center: [138.2906, 37.5873],
        });

        map.on('style.load', () => {
            map.setFog({
                color: 'rgb(186, 210, 235)',
                'high-color': 'rgb(36, 92, 223)',
                'horizon-blend': 0.02,
                'space-color': 'rgb(11, 11, 25)',
                'star-intensity': 0.6
            });
        });

        map.on('load', () => {

            //##### 指標データ #####//
            map.addSource('tourist_attractions', {
                type: 'geojson',
                // Use a URL for the value for the `data` property.
                data: './geojson/tourist_attractions.geojson' 
            });

            map.addLayer({
                'id': 'tourist_attractions-layer',
                'type': 'circle',
                'source': 'tourist_attractions',
                'paint': {
                    // Adjust circle radius based on the 'radius' property in the GeoJSON file
                    'circle-radius': [
                        'interpolate', 
                        ['linear'], 
                        ['get', 'Reviews'], 
                        1000, 5,  // Minimum value (1) maps to a circle radius of 2
                        150000, 50 // Maximum value (10) maps to a circle radius of 20
                    ],
                    'circle-stroke-width': 1,
                    'circle-color': 'yellow',
                    'circle-opacity': 0.8,
                    'circle-stroke-color': 'white',
                }
            });

            
            /* --------------------------------------------------------
            　観光スポットのポイントデータを追加
            -------------------------------------------------------- */
            map.loadImage(
                '../../img/marker-attraction.png',
                (error, image) => {
                    if (error) throw error;

                    // Add the image to the map style.
                    map.addImage('attractionicon', image);

                    // Add a data source containing several points' features.
                    map.addSource('attraction_spots', {
                        'type': 'geojson',
                        'data': {
                            'type': 'FeatureCollection',
                                'features': [
                                    {'type': 'Feature', 'properties': {'name': 'Central Park New York', 'description': '<strong>Central Park New York</strong><p><img src="../../img/tourist_attractions/Central Park New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9655834, 40.7825547]}},
                                    {'type': 'Feature', 'properties': {'name': 'Big Ben London', 'description': '<strong>Big Ben London</strong><p><img src="../../img/tourist_attractions/Big Ben London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1246254, 51.50072919999999]}},
                                    {'type': 'Feature', 'properties': {'name': 'Merlion Park Singapore', 'description': '<strong>Merlion Park Singapore</strong><p><img src="../../img/tourist_attractions/Merlion Park Singapore.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [103.8543872, 1.2867449]}},
                                    {'type': 'Feature', 'properties': {'name': 'Eiffel Tower Paris', 'description': '<strong>Eiffel Tower Paris</strong><p><img src="../../img/tourist_attractions/Eiffel Tower Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.2944813, 48.85837009999999]}},
                                    {'type': 'Feature', 'properties': {'name': 'Notre Dame Paris', 'description': '<strong>Notre Dame Paris</strong><p><img src="../../img/tourist_attractions/Notre Dame Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.3499021, 48.85296820000001]}},
                                    {'type': 'Feature', 'properties': {'name': 'Tower Bridge London', 'description': '<strong>Tower Bridge London</strong><p><img src="../../img/tourist_attractions/Tower Bridge London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.0753564999999999, 51.5054564]}},
                                    {'type': 'Feature', 'properties': {'name': 'British Museum London', 'description': '<strong>British Museum London</strong><p><img src="../../img/tourist_attractions/British Museum London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1269566, 51.5194133]}},
                                    {'type': 'Feature', 'properties': {'name': 'Gardens by the Bay Singapore', 'description': '<strong>Gardens by the Bay Singapore</strong><p><img src="../../img/tourist_attractions/Gardens by the Bay Singapore.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [103.8636132, 1.2815683]}},
                                    {'type': 'Feature', 'properties': {'name': 'London Eye London', 'description': '<strong>London Eye London</strong><p><img src="../../img/tourist_attractions/London Eye London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.1195192, 51.5031864]}},
                                    {'type': 'Feature', 'properties': {'name': 'Louvre Museum London', 'description': '<strong>Louvre Museum London</strong><p><img src="../../img/tourist_attractions/Louvre Museum London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.337644, 48.8606111]}},
                                    {'type': 'Feature', 'properties': {'name': 'Arc de Triomphe Paris', 'description': '<strong>Arc de Triomphe Paris</strong><p><img src="../../img/tourist_attractions/Arc de Triomphe Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.2950275, 48.8737917]}},
                                    {'type': 'Feature', 'properties': {'name': 'Rockefeller Center New York', 'description': '<strong>Rockefeller Center New York</strong><p><img src="../../img/tourist_attractions/Rockefeller Center New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.9786736, 40.7587402]}},
                                    {'type': 'Feature', 'properties': {'name': 'Statue of Liberty New York', 'description': '<strong>Statue of Liberty New York</strong><p><img src="../../img/tourist_attractions/Statue of Liberty New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-74.04450039999999, 40.6892494]}},
                                    {'type': 'Feature', 'properties': {'name': 'Tower of London', 'description': '<strong>Tower of London</strong><p><img src="../../img/tourist_attractions/Tower of London.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-0.0759493, 51.50811239999999]}},
                                    {'type': 'Feature', 'properties': {'name': "Musee d'Orsay Paris", 'description': '<strong>Musee d\'Orsay Paris</strong><p><img src="../../img/tourist_attractions/Musee d\'Orsay Paris.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [2.3265614, 48.8599614]}},
                                    {'type': 'Feature', 'properties': {'name': 'Empire State Building New York', 'description': '<strong>Empire State Building New York</strong><p><img src="../../img/tourist_attractions/Empire State Building New York.jpg"></img></p>'}, 'geometry': {'type': 'Point', 'coordinates': [-73.98566439999999, 40.7484405]}},
                                ]
                        }
                    });

                    // Add a layer to use the image to represent the data.
                    map.addLayer({
                        'id': 'attraction_spots',
                        'type': 'symbol',
                        'source': 'attraction_spots', // reference the data source
                        'layout': {
                            'icon-image': 'attractionicon', // reference the image
                            'icon-size': 1,
                            'visibility': 'visible'
                        },
                    });
                    // On click, get coordinates and a description.
                    map.on('click', 'attraction_spots', (e) => {
                        const coordinates = e.features[0].geometry.coordinates.slice();
                        const description = e.features[0].properties.description;

                        while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                        }
                        // Create a popup object
                        new mapboxgl.Popup({className: 'popupattraction_spots'})
                            .setLngLat(coordinates)
                            .setHTML(description)
                            .addTo(map);
                    });
                    map.on('mouseenter', 'attraction_spots', () => {
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    map.on('mouseleave', 'attraction_spots', () => {
                        map.getCanvas().style.cursor = '';
                    });
                }
            );

            // ##### 半径5,10,20,30,40,50kmのgeojsonを表示 ##### //
            // 半径レイヤー
            const radii = [5, 10, 20, 30, 40, 50];
            radii.forEach(r => {
                map.addSource(`radius_${r}km`, {
                    'type': 'geojson',
                    'data': `../geojson_common/radius_${r}km.geojson`
                });
                map.addLayer({
                    'id': `radius_${r}km`,
                    'type': 'line',
                    'source': `radius_${r}km`,
                    'layout': { 'visibility': 'none' }, // 初期非表示
                    'paint': {
                        'line-color': 'white',
                        'line-width': 1.5,
                        'line-dasharray': [2, 2],
                    },
                });
            });

            // ===== ポップアップ表示 ===== 
            const popup = new mapboxgl.Popup({
                closeButton: false,
                closeOnClick: false
            });
            
            map.on('mouseenter', 'tourist_attractions-layer', (e) => {
                
                map.getCanvas().style.cursor = 'pointer';
                
                const coordinates = e.features[0].geometry.coordinates.slice();      
                const description = e.features[0].properties["Spot"];
                const reviews = e.features[0].properties["Reviews"].toLocaleString();
                
                while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                }
                
                popup.setLngLat(coordinates).setHTML(`<h3>${description}</h3><p>レビュー数: ${reviews}</p>`).addTo(map);
            });
            
            map.on('mouseleave', 'tourist_attractions-layer', () => {
            map.getCanvas().style.cursor = '';
            popup.remove();
            });

        });
        
        // ===== 都市定義 =====
        const cities = {
            GLOBE: { center: [138.2906, 37.5873], label: 'Globe', zoom: 3, pitch: 0, bearing: 0 },
            TYO: { center: [139.7528, 35.6854], label: 'Tokyo', zoom: 12, pitch: 0, bearing: 0 },
            LON: { center: [-0.1281, 51.5081], label: 'London', zoom: 12, pitch: 0, bearing: 0 },
            NYC: { center: [-73.9855, 40.7582], label: 'New York', zoom: 12, pitch: 0, bearing: 0 },
            PAR: { center: [2.34732386, 48.854872],  label: 'Paris', zoom: 12, pitch: 0, bearing: 0 },
            SIN: { center: [103.8513, 1.2830], label: 'Singapore', zoom: 12, pitch: 0, bearing: 0 },
        };

        // ===== 都市名ボタン生成 =====
        const cityContainer = document.createElement('div');
        cityContainer.style.cssText = `
            position: absolute;
            z-index: 2;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        `;

        Object.entries(cities).forEach(([code, city]) => {
            const btn = document.createElement('button');
            btn.textContent = code;
            btn.style.cssText = `
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                border: 1px solid white;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
            `;
            btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
            btn.addEventListener('mouseout',  () => btn.style.background = 'rgba(0,0,0,0.6)');
            btn.addEventListener('click', () => {
                map.flyTo({
                    center: city.center,
                    zoom: city.zoom,
                    pitch: city.pitch,
                    bearing: city.bearing,
                    duration: 3000,
                    essential: true,
                });
            });
            cityContainer.appendChild(btn);
        });

        document.getElementById('map').appendChild(cityContainer);

        // ===== 半径トグルボタン =====
        const radiusContainer = document.createElement('div');
        radiusContainer.style.cssText = `
            position: absolute;
            z-index: 2;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        `;

        const radii = [5, 10, 20, 30, 40, 50];
        radii.forEach(r => {
            const btn = document.createElement('button');
            btn.textContent = `${r}km`;
            btn.dataset.active = 'false';
            btn.style.cssText = `
                padding: 4px 8px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                border: 1px solid white;
                border-radius: 4px;
                cursor: pointer;
                font-size: 12px;
                font-weight: bold;
            `;
            btn.addEventListener('click', () => {
                const isActive = btn.dataset.active === 'true';
                map.setLayoutProperty(
                    `radius_${r}km`,
                    'visibility',
                    isActive ? 'none' : 'visible'
                );
                btn.dataset.active = isActive ? 'false' : 'true';
                btn.style.background = isActive ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.3)';
            });
            radiusContainer.appendChild(btn);
        });

        document.getElementById('map').appendChild(radiusContainer);

    </script>

</body>

</html>
